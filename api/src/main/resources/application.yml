server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: rota-de-estudo-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rota_estudo}
    username: ${DATABASE_USERNAME:rota}
    password: ${DATABASE_PASSWORD:rota}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:false}

app:
  cors:
    allowed-origins: ${FRONT_ORIGINS:http://localhost:5173}
