services:
  db:
    image: postgres:16-alpine
    container_name: rota-estudo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rota}
      POSTGRES_DB: ${POSTGRES_DB:-rota_estudo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rota-estudo-api:
    build:
      context: ./api
    container_name: rota-estudo-api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rota_estudo}
      DATABASE_USERNAME: ${POSTGRES_USER:-rota}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-rota}
      FRONT_ORIGINS: ${FRONT_ORIGINS:-http://localhost:5173,http://localhost:8081}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  rota-estudo-front:
    build:
      context: ./front
    container_name: rota-estudo-front
    depends_on:
      rota-estudo-api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
