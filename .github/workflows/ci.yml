name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Spring Boot)
    if: hashFiles('api/pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK (placeholder)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run tests (placeholder — Fase 0)
        run: echo "Fase 0 — scaffold; rodar mvn test quando o módulo existir"

  front:
    name: front (Vite)
    if: hashFiles('front/pnpm-lock.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm (placeholder)
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node (placeholder)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - name: Install (placeholder — Fase 0)
        working-directory: front
        run: echo "Fase 0 — scaffold; rodar pnpm install --frozen-lockfile quando existir"
