name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Spring Boot)
    if: hashFiles('api/pom.xml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests (placeholder)
        working-directory: api
        run: echo "Fase 0 — scaffold; rodar mvn test quando o módulo existir"

  front:
    name: front (Vite)
    if: hashFiles('front/pnpm-lock.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - name: Install
        working-directory: front
        run: pnpm install --frozen-lockfile
      - name: Run tests (placeholder)
        working-directory: front
        run: echo "Fase 0 — scaffold; rodar vitest quando o app existir"